plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
    alias(libs.plugins.secrets.gradle.plugin)
}

// Đọc key từ local.properties; nếu không có (ví dụ máy Thầy clone về) thì dùng fallback key của nhóm
Properties localProps = new Properties()
File localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newDataInputStream())
}
def mapsApiKey = localProps.getProperty('MAPS_API_KEY') ?: "AIzaSyCgY9ag4EjvCEC29t8aJVVl2ysciz3DL3E"

android {
    namespace 'com.phatvv9.wwarning'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.phatvv9.wwarning"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation(libs.androidx.credentials)
implementation(libs.androidx.credentials.play.services.auth)
implementation(libs.googleid)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.play.services.maps
    implementation libs.play.services.location
    implementation libs.geofire.android.common

    implementation libs.navigation.fragment.ktx
    implementation libs.navigation.ui.ktx

    // WorkManager (theo chuẩn Version Catalog)
    implementation libs.androidx.work.runtime

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}